<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOLO ONNX Detection</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#677084; --accent:#1f7a4d; --border:#dde1e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --card:#1d2128; --text:#e7e9ee; --muted:#9aa3b2; --accent:#3ec486; --border:#2e343e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:1000px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  #info { color:var(--muted); font-size:13px; margin-bottom:16px; }
  nav { display:flex; gap:6px; margin-bottom:16px; }
  nav button { flex:1; }
  button { padding:9px 14px; border:1px solid var(--border); border-radius:8px; background:var(--card);
           color:var(--text); font:inherit; cursor:pointer; }
  button.active, button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  section { display:none; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  section.active { display:block; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:12px; }
  label { color:var(--muted); font-size:13px; }
  input[type=range] { vertical-align:middle; }
  .view { position:relative; width:100%; background:#000; border-radius:8px; overflow:hidden; min-height:120px; }
  .view img, .view video { display:block; width:100%; height:auto; }
  .view canvas { position:absolute; inset:0; width:100%; height:100%; }
  .stats { font-variant-numeric:tabular-nums; color:var(--muted); font-size:13px; margin-top:10px; }
  .stats b { color:var(--text); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Détection YOLO (ONNX)</h1>
  <div id="info">Chargement du modèle…</div>

  <div class="row">
    <label>Confiance min <input id="conf" type="range" min="0.25" max="0.95" step="0.05" value="0.25">
      <span id="confVal">0.25</span></label>
    <label><input id="persons" type="checkbox"> Personnes uniquement</label>
  </div>

  <nav>
    <button data-tab="image" class="active">Image</button>
    <button data-tab="video">Vidéo</button>
    <button data-tab="webcam">Webcam</button>
  </nav>

  <section id="image" class="active">
    <div class="row"><input id="imgFile" type="file" accept="image/*"></div>
    <div class="view"><img id="imgOut" alt=""></div>
    <div class="stats" id="imgStats"></div>
  </section>

  <section id="video">
    <div class="row">
      <input id="vidFile" type="file" accept="video/*">
      <button id="vidStart" class="primary" disabled>Analyser</button>
      <a id="vidDownload" hidden>Télécharger la vidéo annotée</a>
    </div>
    <div class="view"><img id="vidOut" alt=""></div>
    <div class="stats" id="vidStats"></div>
  </section>

  <section id="webcam">
    <div class="row">
      <button id="camStart" class="primary">Démarrer la webcam</button>
      <button id="camStop" disabled>Arrêter</button>
    </div>
    <div class="view"><video id="camVideo" playsinline muted></video><canvas id="camOverlay"></canvas></div>
    <div class="stats" id="camStats"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const params = () => `conf=${$("conf").value}&persons_only=${$("persons").checked}`;
const PERSON = "#00dc00", OTHER = "#ff8c1f";

// ---------------------------------------------------------------- common
fetch("/api/health").then(r => r.json()).then(h => {
  $("info").textContent = `Modèle ${h.model} · ${h.provider} · entrée ${h.input_size.join("×")}`;
}).catch(() => $("info").textContent = "API indisponible");

$("conf").oninput = () => $("confVal").textContent = (+$("conf").value).toFixed(2);

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button, section").forEach(el => el.classList.remove("active"));
  b.classList.add("active");
  $(b.dataset.tab).classList.add("active");
  if (b.dataset.tab !== "webcam") stopCam();
});

async function postImage(blob, annotate) {
  const fd = new FormData();
  fd.append("file", blob, "frame.jpg");
  const r = await fetch(`/api/image?${params()}&annotate=${annotate}`, { method: "POST", body: fd });
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
}

// ---------------------------------------------------------------- image
$("imgFile").onchange = async () => {
  const f = $("imgFile").files[0];
  if (!f) return;
  $("imgStats").textContent = "Analyse…";
  try {
    const d = await postImage(f, true);
    $("imgOut").src = d.image;
    $("imgStats").innerHTML = `<b>${d.persons}</b> personne(s) · <b>${d.count}</b> objet(s) · ` +
      `${d.width}×${d.height} · inférence <b>${d.inference_ms} ms</b>`;
  } catch (e) { $("imgStats").textContent = "Erreur : " + e.message; }
};

// ---------------------------------------------------------------- video
let vidTimer = null;
$("vidFile").onchange = () => { $("vidStart").disabled = !$("vidFile").files[0]; };
$("vidStart").onclick = async () => {
  const f = $("vidFile").files[0];
  $("vidStart").disabled = true;
  $("vidDownload").hidden = true;
  $("vidStats").textContent = "Envoi de la vidéo…";
  const fd = new FormData();
  fd.append("file", f);
  const r = await fetch("/api/video", { method: "POST", body: fd });
  const up = await r.json();
  if (!r.ok) { $("vidStats").textContent = "Erreur : " + up.detail; $("vidStart").disabled = false; return; }

  $("vidOut").src = `/api/video/${up.id}/stream?${params()}`;
  clearInterval(vidTimer);
  vidTimer = setInterval(async () => {
    const s = await (await fetch(`/api/video/${up.id}`)).json();
    const pct = s.total_frames ? Math.round(100 * s.frames / s.total_frames) : 0;
    $("vidStats").innerHTML = `${s.status} · image <b>${s.frames}/${s.total_frames}</b> (${pct}%) · ` +
      `max <b>${s.max_persons}</b> personne(s) · inférence moy. <b>${s.avg_inference_ms} ms</b>`;
    if (s.status === "done") {
      $("vidDownload").href = `/api/video/${up.id}/download`;
      $("vidDownload").hidden = false;
    }
    if (["done", "error", "stopped"].includes(s.status)) { clearInterval(vidTimer); $("vidStart").disabled = false; }
  }, 500);
};

// ---------------------------------------------------------------- webcam
let camStream = null, camRunning = false;
const grab = document.createElement("canvas");

async function startCam() {
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
  } catch (e) { $("camStats").textContent = "Webcam inaccessible : " + e.message; return; }
  const v = $("camVideo");
  v.srcObject = camStream;
  await v.play();
  camRunning = true;
  $("camStart").disabled = true;
  $("camStop").disabled = false;
  camLoop();
}

function stopCam() {
  camRunning = false;
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  camStream = null;
  $("camStart").disabled = false;
  $("camStop").disabled = true;
  const o = $("camOverlay");
  o.getContext("2d").clearRect(0, 0, o.width, o.height);
}

async function camLoop() {
  const v = $("camVideo"), o = $("camOverlay"), ctx = o.getContext("2d");
  const scale = Math.min(1, 640 / v.videoWidth);          // send a smaller frame: less upload
  grab.width = o.width = Math.round(v.videoWidth * scale);
  grab.height = o.height = Math.round(v.videoHeight * scale);
  let last = performance.now();
  while (camRunning) {
    grab.getContext("2d").drawImage(v, 0, 0, grab.width, grab.height);
    const blob = await new Promise(res => grab.toBlob(res, "image/jpeg", 0.8));
    let d;
    try { d = await postImage(blob, false); }
    catch (e) { $("camStats").textContent = "Erreur : " + e.message; break; }
    if (!camRunning) break;
    drawBoxes(ctx, o, d.detections);
    const now = performance.now();
    $("camStats").innerHTML = `<b>${d.persons}</b> personne(s) · <b>${d.count}</b> objet(s) · ` +
      `inférence <b>${d.inference_ms} ms</b> · <b>${(1000 / (now - last)).toFixed(1)}</b> FPS`;
    last = now;
  }
}

function drawBoxes(ctx, canvas, dets) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineWidth = 2;
  ctx.font = "13px system-ui";
  for (const d of dets) {
    const [x1, y1, x2, y2] = d.box, color = d.class_id === 0 ? PERSON : OTHER;
    const label = `${d.label} ${d.conf.toFixed(2)}`;
    ctx.strokeStyle = ctx.fillStyle = color;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    const w = ctx.measureText(label).width + 6, y = y1 > 18 ? y1 - 18 : y1;
    ctx.fillRect(x1, y, w, 18);
    ctx.fillStyle = "#fff";
    ctx.fillText(label, x1 + 3, y + 13);
  }
}

$("camStart").onclick = startCam;
$("camStop").onclick = stopCam;
</script>
</body>
</html>
